packages:
  - apps/*
  - infra/*
  - oxlint-plugin-t3code
  - packages/*
  - scripts

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  mongodb-memory-server: true
  msgpackr-extract: true
  msw: false
  node-pty: true
  sharp: true
  utf-8-validate: false
  workerd: false

catalog:
  "@neondatabase/auth": 0.5.0-beta
  "@neondatabase/auth-ui": 0.3.0-beta
  "@neondatabase/serverless": 1.1.0
  "@effect/atom-react": 4.0.0-beta.78
  "@effect/openapi-generator": 4.0.0-beta.78
  "@effect/platform-bun": 4.0.0-beta.78
  "@effect/platform-node": 4.0.0-beta.78
  "@effect/platform-node-shared": 4.0.0-beta.78
  "@effect/sql-pg": 4.0.0-beta.78
  "@effect/sql-sqlite-bun": 4.0.0-beta.78
  "@effect/tsgo": 0.13.2
  "@effect/vitest": 4.0.0-beta.78
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@pierre/diffs": 1.3.0-beta.5
  "@types/node": 24.12.4
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  effect: 4.0.0-beta.78
  jose: 6.2.2
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2
  yaml: ^2.9.0

overrides:
  alchemy: "file:stubs/alchemy-stub"
  "@effect/atom-react": "catalog:"
  "@effect/platform-bun": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/sql-sqlite-bun": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@expo/metro-config": 57.0.13
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  yaml: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.0-beta.78": patches/@effect__vitest@4.0.0-beta.78.patch
  "@expo/metro-config@57.0.13": patches/@expo%2Fmetro-config@57.0.13.patch
  "@ff-labs/fff-node@0.9.4": patches/@ff-labs__fff-node@0.9.4.patch
  "@legendapp/list@3.2.0": patches/@legendapp__list@3.2.0.patch
  "@pierre/diffs@1.3.0-beta.5": patches/@pierre%2Fdiffs@1.3.0-beta.5.patch
  "@react-native-menu/menu@2.0.0": patches/@react-native-menu__menu@2.0.0.patch
  "@react-navigation/native-stack@7.17.6": patches/@react-navigation%2Fnative-stack@7.17.6.patch
  effect@4.0.0-beta.78: patches/effect@4.0.0-beta.78.patch
  react-native-gesture-handler@2.32.0: patches/react-native-gesture-handler@2.32.0.patch
  react-native-keyboard-controller@1.21.9: patches/react-native-keyboard-controller@1.21.9.patch
  react-native-nitro-modules@0.37.1: patches/react-native-nitro-modules@0.37.1.patch
  react-native-screens@4.26.2: patches/react-native-screens@4.26.2.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
