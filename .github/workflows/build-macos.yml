name: Build Axle Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  AXLE_GITHUB_CLIENT_ID: ${{ vars.AXLE_GITHUB_CLIENT_ID }}
  AXLE_GITHUB_AUTH_BROKER_URL: ${{ vars.AXLE_GITHUB_AUTH_BROKER_URL }}
  AXLE_PLUGIN_WORKER_URL: ${{ vars.AXLE_PLUGIN_WORKER_URL }}
  VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.AXLE_CLERK_PUBLISHABLE_KEY }}
  VITE_AXLE_PLUGIN_WORKER_URL: ${{ vars.AXLE_PLUGIN_WORKER_URL }}
  VITE_ACCOUNT_API_URL: ${{ vars.AXLE_ACCOUNT_API_URL }}

jobs:
  test-update-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test platform update routes
        run: npm --prefix axle-download-worker test

  prepare-release:
    needs: test-update-feeds
    runs-on: ubuntu-latest
    steps:
      - name: Verify release configuration
        # Release builds read the account API URL at build time; without it the
        # shipped app cannot resolve plans or start checkout. Fail here instead
        # of shipping a build whose billing page is dead.
        env:
          AXLE_ACCOUNT_API_URL: ${{ vars.AXLE_ACCOUNT_API_URL }}
        run: |
          if [ -z "$AXLE_ACCOUNT_API_URL" ]; then
            echo "::error::Repository variable AXLE_ACCOUNT_API_URL is required (Settings > Secrets and variables > Actions > Variables). It must be the deployed account API origin, e.g. https://axle-account.<subdomain>.workers.dev"
            exit 1
          fi

      - name: Ensure GitHub release exists (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Axle ${GITHUB_REF_NAME}" --draft
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos-x64:
    needs: [test-update-feeds, prepare-release]
    runs-on: macos-14
    defaults:
      run:
        working-directory: axle-desktop/source
    env:
      # A stored Developer ID certificate is the only switch for the whole Apple
      # signing path, so a repository without one still publishes an unsigned
      # artifact instead of failing the release.
      T3CODE_DESKTOP_SIGNED: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: axle-desktop/source/pnpm-lock.yaml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-apple-darwin

      - run: cargo build --release -p axle_cli
        working-directory: .

      - run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        working-directory: axle-desktop/source
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Align release package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/update-release-package-versions.ts "${GITHUB_REF_NAME#v}"

      - run: pnpm --config.verify-deps-before-run=false exec vp run --filter './apps/*' --filter './packages/*' --filter './oxlint-plugin-t3code' --filter './scripts' build
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production

      - name: Verify GitHub OAuth bundle
        run: node scripts/verify-github-oauth-build.mjs
        working-directory: axle-desktop/source

      - name: Prepare Apple signing material
        if: env.CSC_LINK != ''
        shell: bash
        run: |
          set -euo pipefail
          material_dir="${RUNNER_TEMP}/axle-apple-signing"
          mkdir -p "$material_dir"
          # electron-builder expects a path to the notarization key rather than
          # its contents, so the secret only becomes a file for this job.
          if [[ -n "${APPLE_API_KEY_CONTENT:-}" ]]; then
            key_path="${material_dir}/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
            echo "APPLE_API_KEY=${key_path}" >> "$GITHUB_ENV"
          fi
          # Passkey builds need a real provisioning profile on disk.
          if [[ -n "${MACOS_PROVISIONING_PROFILE:-}" ]]; then
            profile_path="${material_dir}/axle.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$profile_path"
            security cms -D -i "$profile_path" > /dev/null
            echo "T3CODE_MACOS_PROVISIONING_PROFILE=${profile_path}" >> "$GITHUB_ENV"
          fi

      - run: pnpm --config.verify-deps-before-run=false dist:desktop:dmg:x64
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production
          AXLE_UPDATE_URL: ${{ vars.AXLE_UPDATE_SITE_URL || 'https://axle-download.axle-download-worker.workers.dev/get' }}/updates/macos/x64
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}

      - name: Verify macOS x64 updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s release/Axle-x64.dmg
          test -s release/Axle-x64.dmg.blockmap
          test -s release/Axle-x64.zip
          test -s release/latest-mac.yml
          grep -q 'Axle-x64.zip' release/latest-mac.yml

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/Axle-x64.dmg --clobber
          gh release upload "${GITHUB_REF_NAME}" release/Axle-x64.dmg.blockmap --clobber
          gh release upload "${GITHUB_REF_NAME}" release/Axle-x64.zip --clobber
          mv release/latest-mac.yml release/latest-mac-x64.yml
          gh release upload "${GITHUB_REF_NAME}" release/latest-mac-x64.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload DMG to temp release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          RELEASE_TAG="preview-${GITHUB_RUN_ID}-x64"
          gh release create "$RELEASE_TAG" release/Axle-x64.dmg --title "Axle macOS x64 (preview)" --notes "Preview build from workflow #${GITHUB_RUN_ID}" --prerelease || true
          gh release upload "$RELEASE_TAG" release/Axle-x64.dmg --clobber || true
          gh release upload "$RELEASE_TAG" release/Axle-x64.dmg.blockmap --clobber || true
          gh release upload "$RELEASE_TAG" release/Axle-x64.zip --clobber || true
          mv release/latest-mac.yml release/latest-mac-x64.yml
          gh release upload "$RELEASE_TAG" release/latest-mac-x64.yml --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos-arm64:
    needs: [test-update-feeds, prepare-release]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: axle-desktop/source
    env:
      # Mirrors the x64 job: signing stays off until a Developer ID certificate
      # is stored, and the same Apple material feeds both architectures.
      T3CODE_DESKTOP_SIGNED: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: axle-desktop/source/pnpm-lock.yaml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin

      - run: cargo build --release -p axle_cli
        working-directory: .

      - run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        working-directory: axle-desktop/source
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Align release package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/update-release-package-versions.ts "${GITHUB_REF_NAME#v}"

      - run: pnpm --config.verify-deps-before-run=false exec vp run --filter './apps/*' --filter './packages/*' --filter './oxlint-plugin-t3code' --filter './scripts' build
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production

      - name: Verify GitHub OAuth bundle
        run: node scripts/verify-github-oauth-build.mjs
        working-directory: axle-desktop/source

      - name: Prepare Apple signing material
        if: env.CSC_LINK != ''
        shell: bash
        run: |
          set -euo pipefail
          material_dir="${RUNNER_TEMP}/axle-apple-signing"
          mkdir -p "$material_dir"
          if [[ -n "${APPLE_API_KEY_CONTENT:-}" ]]; then
            key_path="${material_dir}/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
            echo "APPLE_API_KEY=${key_path}" >> "$GITHUB_ENV"
          fi
          if [[ -n "${MACOS_PROVISIONING_PROFILE:-}" ]]; then
            profile_path="${material_dir}/axle.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$profile_path"
            security cms -D -i "$profile_path" > /dev/null
            echo "T3CODE_MACOS_PROVISIONING_PROFILE=${profile_path}" >> "$GITHUB_ENV"
          fi

      - run: pnpm --config.verify-deps-before-run=false dist:desktop:dmg:arm64
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production
          AXLE_UPDATE_URL: ${{ vars.AXLE_UPDATE_SITE_URL || 'https://axle-download.axle-download-worker.workers.dev/get' }}/updates/macos/arm64
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}

      - name: Verify macOS arm64 updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s release/Axle-arm64.dmg
          test -s release/Axle-arm64.dmg.blockmap
          test -s release/Axle-arm64.zip
          test -s release/latest-mac.yml
          grep -q 'Axle-arm64.zip' release/latest-mac.yml

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/Axle-arm64.dmg --clobber
          gh release upload "${GITHUB_REF_NAME}" release/Axle-arm64.dmg.blockmap --clobber
          gh release upload "${GITHUB_REF_NAME}" release/Axle-arm64.zip --clobber
          mv release/latest-mac.yml release/latest-mac-arm64.yml
          gh release upload "${GITHUB_REF_NAME}" release/latest-mac-arm64.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload DMG to temp release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          RELEASE_TAG="preview-${GITHUB_RUN_ID}-arm64"
          gh release create "$RELEASE_TAG" release/Axle-arm64.dmg --title "Axle macOS arm64 (preview)" --notes "Preview build from workflow #${GITHUB_RUN_ID}" --prerelease || true
          gh release upload "$RELEASE_TAG" release/Axle-arm64.dmg --clobber || true
          gh release upload "$RELEASE_TAG" release/Axle-arm64.dmg.blockmap --clobber || true
          gh release upload "$RELEASE_TAG" release/Axle-arm64.zip --clobber || true
          mv release/latest-mac.yml release/latest-mac-arm64.yml
          gh release upload "$RELEASE_TAG" release/latest-mac-arm64.yml --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux-x64:
    needs: [test-update-feeds, prepare-release]
    # node-pty is compiled from source during install, so the runner's glibc
    # becomes the artifact's minimum. ubuntu-latest now resolves to 26.04
    # (glibc 2.42), which breaks the AppImage on older distros. Pin the oldest
    # available LTS runner (glibc 2.35) to keep the Linux build portable.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: axle-desktop/source

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: axle-desktop/source/pnpm-lock.yaml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - run: cargo build --release -p axle_cli
        working-directory: .

      - run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        working-directory: axle-desktop/source
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Align release package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/update-release-package-versions.ts "${GITHUB_REF_NAME#v}"

      - run: pnpm --config.verify-deps-before-run=false exec vp run --filter './apps/*' --filter './packages/*' --filter './oxlint-plugin-t3code' --filter './scripts' build
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production

      - name: Prepare Linux release directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release release-appimage release-deb
          mkdir -p release release-appimage release-deb

      - run: pnpm --config.verify-deps-before-run=false dist:desktop:linux
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production
          AXLE_UPDATE_URL: ${{ vars.AXLE_UPDATE_SITE_URL || 'https://axle-download.axle-download-worker.workers.dev/get' }}/updates/linux
          T3CODE_DESKTOP_OUTPUT_DIR: release-appimage

      - run: pnpm --config.verify-deps-before-run=false dist:desktop:linux:deb
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production
          T3CODE_DESKTOP_OUTPUT_DIR: release-deb

      - name: Assemble Linux release artifacts
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find release-appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find release-deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          cp "$appimage" release/Axle-x64.AppImage
          cp "$deb" release/Axle-amd64.deb
          if [[ -f release-appimage/latest-linux.yml ]]; then
            cp release-appimage/latest-linux.yml release/latest-linux.yml
            sed -i 's/Axle-x86_64\.AppImage/Axle-x64.AppImage/g' release/latest-linux.yml
          fi
          if [[ -f release-appimage/Axle-x64.AppImage.zsync ]]; then
            cp release-appimage/Axle-x64.AppImage.zsync release/Axle-x64.AppImage.zsync
          elif [[ -f release-appimage/Axle-x86_64.AppImage.zsync ]]; then
            cp release-appimage/Axle-x86_64.AppImage.zsync release/Axle-x64.AppImage.zsync
          fi

      - name: Verify GitHub OAuth bundle
        run: node scripts/verify-github-oauth-build.mjs
        working-directory: axle-desktop/source

      - name: Verify Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s release/Axle-x86_64.AppImage && ! -e release/Axle-x64.AppImage ]]; then
            cp release/Axle-x86_64.AppImage release/Axle-x64.AppImage
          fi
          test -s release/Axle-x64.AppImage
          test -s release/Axle-amd64.deb
          test -s release/latest-linux.yml
          grep -q 'Axle-x64.AppImage' release/latest-linux.yml
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Verify Linux node-pty glibc baseline
        shell: bash
        run: |
          set -euo pipefail
          appimage="$PWD/release/Axle-x64.AppImage"
          extract_dir="$RUNNER_TEMP/axle-appimage-glibc-check"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          (cd "$extract_dir" && "$appimage" --appimage-extract 'resources/app.asar.unpacked/node_modules/node-pty/*' >/dev/null)
          pty="$extract_dir/squashfs-root/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node"
          test -f "$pty"
          max_glibc="$(readelf --version-info "$pty" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -Vu | tail -1)"
          test -n "$max_glibc"
          echo "node-pty requires at most glibc $max_glibc"
          printf '%s\n%s\n' "$max_glibc" "2.35" | sort -V -C || {
            echo "::error::node-pty requires GLIBC_$max_glibc, newer than the Ubuntu 22.04 baseline (2.35). Pin the Linux build runner to ubuntu-22.04 or rebuild node-pty against an older glibc."
            exit 1
          }

      - name: Sign Linux AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          AXLE_LINUX_GPG_PRIVATE_KEY: ${{ secrets.AXLE_LINUX_GPG_PRIVATE_KEY }}
          AXLE_LINUX_GPG_KEY_ID: ${{ secrets.AXLE_LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$AXLE_LINUX_GPG_PRIVATE_KEY" || -z "$AXLE_LINUX_GPG_KEY_ID" ]]; then
            echo "::warning title=Linux AppImage signing skipped::AXLE_LINUX_GPG_PRIVATE_KEY / AXLE_LINUX_GPG_KEY_ID are not configured; publishing an unsigned AppImage. Add both repository secrets to enable signed Linux builds."
            exit 0
          fi
          key_path="$RUNNER_TEMP/axle-linux-signing-key.asc"
          if [[ "$AXLE_LINUX_GPG_PRIVATE_KEY" == "-----BEGIN"* ]]; then
            printf '%s' "$AXLE_LINUX_GPG_PRIVATE_KEY" > "$key_path"
          else
            printf '%s' "$AXLE_LINUX_GPG_PRIVATE_KEY" | base64 --decode > "$key_path"
          fi
          GNUPGHOME="$RUNNER_TEMP/gnupg"
          export GNUPGHOME
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import "$key_path"
          gpg --batch --yes --local-user "$AXLE_LINUX_GPG_KEY_ID" --armor --detach-sign \
            --output release/Axle-x64.AppImage.asc release/Axle-x64.AppImage
          gpg --batch --verify release/Axle-x64.AppImage.asc release/Axle-x64.AppImage
          rm -f "$key_path"

      - name: Upload Linux artifacts to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release/Axle-x86_64.AppImage release/Axle-x64.AppImage release/Axle-x86_64.AppImage.zsync release/Axle-x64.AppImage.zsync release/Axle-x64.AppImage.asc release/Axle-amd64.deb release/latest-linux.yml; do
            if [[ -f "$artifact" ]]; then
              gh release upload "${GITHUB_REF_NAME}" "$artifact" --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Linux artifacts to temp release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="preview-${GITHUB_RUN_ID}-linux"
          gh release create "$RELEASE_TAG" release/Axle-x64.AppImage --title "Axle Linux x64 (preview)" --notes "Preview build from workflow #${GITHUB_RUN_ID}" --prerelease || true
          for artifact in release/Axle-x86_64.AppImage release/Axle-x64.AppImage release/Axle-x86_64.AppImage.zsync release/Axle-x64.AppImage.zsync release/Axle-amd64.deb release/latest-linux.yml; do
            if [[ -f "$artifact" ]]; then
              gh release upload "$RELEASE_TAG" "$artifact" --clobber || true
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    needs: [test-update-feeds, prepare-release]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: axle-desktop/source

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: axle-desktop/source/pnpm-lock.yaml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release -p axle_cli
        working-directory: .

      - run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        working-directory: axle-desktop/source
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Align release package versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: node scripts/update-release-package-versions.ts ($env:GITHUB_REF_NAME -replace '^v', '')

      - run: pnpm --config.verify-deps-before-run=false exec vp run --filter './apps/*' --filter './packages/*' --filter './oxlint-plugin-t3code' --filter './scripts' build
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production

      - name: Verify GitHub OAuth bundle
        run: node scripts/verify-github-oauth-build.mjs
        working-directory: axle-desktop/source

      - run: pnpm --config.verify-deps-before-run=false dist:desktop:win:x64
        working-directory: axle-desktop/source
        env:
          NODE_ENV: production
          AXLE_UPDATE_URL: ${{ vars.AXLE_UPDATE_SITE_URL || 'https://axle-download.axle-download-worker.workers.dev/get' }}/updates/windows

      - name: Verify Windows updater artifacts
        shell: pwsh
        run: |
          $requiredFiles = @('release/Axle-x64.exe', 'release/Axle-x64.exe.blockmap', 'release/latest.yml')
          foreach ($file in $requiredFiles) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing Windows updater artifact: $file" }
          }
          if ((Get-Content -Raw release/latest.yml) -notmatch 'Axle-x64\.exe') { throw 'Windows update feed does not reference the installer.' }

      - name: Upload EXE to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          gh release upload "$env:GITHUB_REF_NAME" release/Axle-x64.exe --clobber
          gh release upload "$env:GITHUB_REF_NAME" release/Axle-x64.exe.blockmap --clobber
          gh release upload "$env:GITHUB_REF_NAME" release/latest.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload EXE to temp release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $RELEASE_TAG = "preview-${env:GITHUB_RUN_ID}-win"
          gh release create "$RELEASE_TAG" release/Axle-x64.exe --title "Axle Windows (preview)" --notes "Preview build from workflow #${env:GITHUB_RUN_ID}" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: [build-macos-x64, build-macos-arm64, build-linux-x64, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Finalize release
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
