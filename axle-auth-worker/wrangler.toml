name = "axle-auth"
main = "src/final.js"
compatibility_date = "2026-08-31"
workers_dev = true

# Public OAuth client IDs are injected into the Worker at build/deploy time.
# All *_CLIENT_SECRET values, PLUGIN_TOKEN_ENCRYPTION_KEY, and
# ANALYTICS_ADMIN_TOKEN must be installed with `wrangler secret put`.
# Never commit provider client secrets here.
[vars]
GITHUB_CLIENT_ID = "Ov23lis8MUy8pjCIAlXe"
# Desktop sign-in runs on the Axle Google OAuth client. The Gmail plugin keeps
# its own GMAIL_CLIENT_ID below, so the two never share credentials.
GOOGLE_CLIENT_ID = "714153517882-8h4vsu1c7l1nj89ev3hcfb04nmbr7vkn.apps.googleusercontent.com"
GMAIL_CLIENT_ID = "885688340167-tig39cne089ljsddr470atomkskk8cv3.apps.googleusercontent.com"
SLACK_CLIENT_ID = "10220491548116.12399528129413"
JIRA_CLIENT_ID = "DKGjvfFpVLvCCb5a8jqh6S991Y5uW4LT"
NOTION_CLIENT_ID = "404d872b-594c-8100-9375-00377cd265f9"
SENTRY_CLIENT_ID = "1b12018a651d622381fbaf8c56f56529296f67ac3bff03b224e9830e421bc36c"
FIGMA_CLIENT_ID = "TrhydLVOAqbLP53nT9JnZO"
# Clerk publishable keys are public. The Worker derives the Clerk issuer and hosts
# the isolated desktop sign-in frame from this value.
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuYXV0aC5zcGFya3kubGxjJA"
# Set to the deployed Worker origin, e.g. https://auth.axle.llc.
PUBLIC_BASE_URL = "https://axle-auth.axle-download-worker.workers.dev"
# Value of the `iss` claim in Axle access tokens, and the base of the published
# JWKS. Keep it pinned so rotating PUBLIC_BASE_URL never invalidates sessions.
AUTH_ISSUER = "https://axle-auth.axle-download-worker.workers.dev"
# The account API is the source of truth for subscription plans; plugin
# connections on paid plugins are gated against /v1/billing/plan through the
# service binding below. INTERNAL_API_TOKEN is installed as a secret with the
# same value as the gateway's.
ACCOUNT_API_URL = "https://axle-account.axle-download-worker.workers.dev"

[[services]]
binding = "ACCOUNT_API_SERVICE"
service = "axle-account"

[[kv_namespaces]]
binding = "PLUGIN_STORE"
id = "f38addbc6f63456e8066f705855bca24"
preview_id = "f38addbc6f63456e8066f705855bca24"

# Tier 2 account store: Axle users, linked OAuth identities, sessions, devices,
# and in-flight sign-in requests. See migrations/0001_accounts.sql.
[[d1_databases]]
binding = "ACCOUNTS_DB"
database_name = "axle-accounts"
database_id = "92573546-757a-4fc4-939c-2eb41015ff13"
